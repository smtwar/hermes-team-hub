<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Team Hub</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #232734;
  --border: #2a2e3a; --text: #e4e6ef; --text2: #8b8fa3;
  --accent: #6c8cff; --accent2: #4a6adf; --green: #34d399; --yellow: #fbbf24;
  --red: #f87171; --orange: #fb923c; --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; }
.header { background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 24px; display: flex; align-items: center; gap: 16px;
  position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 20px; font-weight: 600; }
.header .sub { color: var(--text2); font-size: 13px; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab-btn { background: none; border: none; color: var(--text2); cursor: pointer;
  padding: 8px 16px; border-radius: var(--radius); font-size: 14px; }
.tab-btn:hover { background: var(--surface2); color: var(--text); }
.tab-btn.active { background: var(--accent); color: #fff; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* 讨论区 */
.chat-header { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
.channel-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.channel-btn { background: var(--surface); border: 1px solid var(--border);
  color: var(--text2); padding: 6px 14px; border-radius: 999px; cursor: pointer;
  font-size: 13px; }
.channel-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.new-channel-btn { background: none; border: 1px dashed var(--border);
  color: var(--text2); padding: 6px 14px; border-radius: 999px; cursor: pointer;
  font-size: 13px; }
.chat-messages { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); height: 450px; overflow-y: auto; padding: 16px;
  margin-bottom: 12px; }
.msg { margin-bottom: 12px; padding: 10px 14px; background: var(--surface2);
  border-radius: var(--radius); }
.msg .sender { font-weight: 600; color: var(--accent); font-size: 13px; }
.msg .time { color: var(--text2); font-size: 11px; float: right; }
.msg .content { margin-top: 4px; font-size: 14px; line-height: 1.5; }
.chat-input { display: flex; gap: 8px; }
.chat-input input { flex: 1; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 10px 14px; border-radius: var(--radius); font-size: 14px; }
.chat-input input:focus { outline: none; border-color: var(--accent); }
.btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px;
  border-radius: var(--radius); cursor: pointer; font-size: 14px; font-weight: 500; }
.btn:hover { background: var(--accent2); }
.btn-sm { padding: 6px 14px; font-size: 13px; }

/* 任务板 */
.task-actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-select { background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 8px 12px; border-radius: var(--radius); font-size: 13px; }
.task-columns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
@media (max-width: 900px) { .task-columns { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 500px) { .task-columns { grid-template-columns: 1fr; } }
.task-col { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px; min-height: 200px; }
.task-col h3 { font-size: 13px; color: var(--text2); margin-bottom: 8px;
  text-transform: uppercase; letter-spacing: 0.5px; }
.col-todo { border-top: 3px solid var(--text2); }
.col-in_progress { border-top: 3px solid var(--accent); }
.col-review { border-top: 3px solid var(--yellow); }
.col-done { border-top: 3px solid var(--green); }
.col-cancelled { border-top: 3px solid var(--red); }
.task-card { background: var(--surface2); border-radius: 6px; padding: 10px 12px;
  margin-bottom: 8px; cursor: pointer; position: relative; }
.task-card:hover { filter: brightness(1.1); }
.task-card .title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.task-card .assignee { font-size: 11px; color: var(--text2); }
.task-card .priority { font-size: 10px; padding: 2px 6px; border-radius: 4px;
  display: inline-block; margin-top: 4px; }
.priority-high { background: var(--red); color: #fff; }
.priority-medium { background: var(--orange); color: #fff; }
.priority-low { background: var(--text2); color: #fff; }

/* 状态墙 */
.status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.status-card { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; }
.status-card .agent { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.status-card .status { color: var(--accent); font-size: 14px; margin-bottom: 8px; }
.status-card .message { color: var(--text2); font-size: 13px; }
.status-card .time { color: var(--text2); font-size: 11px; margin-top: 8px; }

/* 模态框 */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px; min-width: 360px; max-width: 500px; width: 90%; }
.modal h2 { font-size: 18px; margin-bottom: 16px; }
.modal label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 4px; }
.modal input, .modal select, .modal textarea { width: 100%; background: var(--bg);
  border: 1px solid var(--border); color: var(--text); padding: 8px 12px;
  border-radius: var(--radius); margin-bottom: 12px; font-size: 14px; }
.modal textarea { min-height: 80px; resize: vertical; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn-cancel { background: var(--surface2); color: var(--text); border: 1px solid var(--border);
  padding: 8px 16px; border-radius: var(--radius); cursor: pointer; }

/* 任务详情弹窗 */
.task-detail-modal .comments { margin-top: 12px; }
.task-detail-modal .comment { background: var(--bg); border-radius: 6px;
  padding: 8px 12px; margin-bottom: 6px; }
.task-detail-modal .comment .author { font-weight: 600; color: var(--accent); font-size: 12px; }
.task-detail-modal .comment .text { font-size: 13px; margin-top: 2px; }
</style>
</head>
<body>
<div class="header">
  <h1>🤝 Hermes Team Hub</h1>
  <span class="sub" id="statusDot">●</span>
  <div class="tabs">
    <button class="tab-btn active" data-tab="chat">💬 讨论区</button>
    <button class="tab-btn" data-tab="tasks">📋 任务板</button>
    <button class="tab-btn" data-tab="status">📊 状态墙</button>
  </div>
</div>
<div class="container">
  <!-- 讨论区 -->
  <div class="tab-panel active" id="panel-chat">
    <div class="chat-header">
      <div class="channel-tabs" id="channelTabs"></div>
      <button class="new-channel-btn" onclick="showNewChannelModal()">+ 新频道</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <input type="text" id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="btn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- 任务板 -->
  <div class="tab-panel" id="panel-tasks">
    <div class="task-actions">
      <button class="btn btn-sm" onclick="showNewTaskModal()">+ 新任务</button>
      <select class="filter-select" id="filterAssignee" onchange="loadTasks()">
        <option value="">全部负责人</option>
      </select>
    </div>
    <div class="task-columns" id="taskColumns"></div>
  </div>

  <!-- 状态墙 -->
  <div class="tab-panel" id="panel-status">
    <div class="status-grid" id="statusGrid"></div>
  </div>
</div>

<!-- 新频道模态框 -->
<div class="modal-overlay" id="newChannelModal">
  <div class="modal">
    <h2>创建新频道</h2>
    <label>频道名称</label>
    <input type="text" id="newChannelName" placeholder="例如: 项目讨论" onkeydown="if(event.key==='Enter')createChannel()">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('newChannelModal')">取消</button>
      <button class="btn" onclick="createChannel()">创建</button>
    </div>
  </div>
</div>

<!-- 新任务模态框 -->
<div class="modal-overlay" id="newTaskModal">
  <div class="modal">
    <h2>创建新任务</h2>
    <label>标题</label>
    <input type="text" id="newTaskTitle" placeholder="任务标题">
    <label>描述</label>
    <textarea id="newTaskDesc" placeholder="任务描述（可选）"></textarea>
    <label>负责人</label>
    <input type="text" id="newTaskAssignee" placeholder="例如: WIN_LOCAL">
    <label>优先级</label>
    <select id="newTaskPriority">
      <option value="medium">中</option>
      <option value="low">低</option>
      <option value="high">高</option>
    </select>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('newTaskModal')">取消</button>
      <button class="btn" onclick="createTask()">创建</button>
    </div>
  </div>
</div>

<!-- 任务详情模态框 -->
<div class="modal-overlay task-detail-modal" id="taskDetailModal">
  <div class="modal" style="max-width:550px">
    <h2 id="detailTitle"></h2>
    <div id="detailBody"></div>
    <div class="modal-actions" style="margin-top:12px">
      <button class="btn-cancel" onclick="closeModal('taskDetailModal')">关闭</button>
    </div>
  </div>
</div>

<script>
const BASE = 'http://39.104.86.113:8765';
const AUTH = { 'Authorization': 'Bearer my-relay-secret-2025', 'Content-Type': 'application/json' };
let currentChannel = 'general';
let lastMsgId = 0;
const AGENT_ID = 'WIN_LOCAL';
const STATUS_LABELS = { todo:'待办', in_progress:'进行中', review:'审查', done:'完成', cancelled:'已取消' };

// Tab 切换
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// 工具
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function showModal(id) { document.getElementById(id).classList.add('show'); }
function escHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
function timeAgo(ts) {
  const sec = (Date.now()/1000 - ts);
  if (sec < 60) return '刚刚';
  if (sec < 3600) return Math.floor(sec/60) + '分钟前';
  if (sec < 86400) return Math.floor(sec/3600) + '小时前';
  return new Date(ts*1000).toLocaleDateString('zh-CN');
}

// ====== 频道管理 ======
async function loadChannels() {
  try {
    const r = await fetch(BASE + '/hub/channels', { headers: AUTH });
    const data = await r.json();
    if (!data.success) return;
    const cont = document.getElementById('channelTabs');
    cont.innerHTML = '';
    data.channels.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'channel-btn' + (ch.name === currentChannel ? ' active' : '');
      btn.textContent = '# ' + ch.name;
      btn.onclick = () => switchChannel(ch.name);
      cont.appendChild(btn);
    });
  } catch(e) {}
}
function switchChannel(name) {
  currentChannel = name;
  lastMsgId = 0;
  document.getElementById('chatMessages').innerHTML = '';
  loadChannels();
  loadMessages();
}

function showNewChannelModal() { showModal('newChannelModal'); }
async function createChannel() {
  const name = document.getElementById('newChannelName').value.trim();
  if (!name) return;
  try {
    await fetch(BASE + '/hub/channel/create', {
      method: 'POST', headers: AUTH,
      body: JSON.stringify({ name, created_by: AGENT_ID })
    });
    document.getElementById('newChannelName').value = '';
    closeModal('newChannelModal');
    switchChannel(name);
  } catch(e) { alert('创建失败'); }
}

// ====== 聊天 ======
async function loadMessages() {
  try {
    const r = await fetch(BASE + '/hub/chat?channel=' + encodeURIComponent(currentChannel) + '&since=' + lastMsgId, { headers: AUTH });
    const data = await r.json();
    if (!data.success || !data.messages.length) return;
    const cont = document.getElementById('chatMessages');
    data.messages.forEach(msg => {
      const div = document.createElement('div'); div.className = 'msg';
      div.innerHTML = `<span class="sender">${escHtml(msg.sender)}</span>
        <span class="time">${timeAgo(msg.timestamp)}</span>
        <div class="content">${escHtml(msg.content)}</div>`;
      cont.appendChild(div);
      lastMsgId = Math.max(lastMsgId, msg.id);
    });
    cont.scrollTop = cont.scrollHeight;
  } catch(e) {}
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  try {
    await fetch(BASE + '/hub/chat/post', {
      method: 'POST', headers: AUTH,
      body: JSON.stringify({ channel: currentChannel, sender: AGENT_ID, content })
    });
  } catch(e) {}
}

// ====== 任务板 ======
async function loadTasks() {
  try {
    const assignee = document.getElementById('filterAssignee').value;
    let url = BASE + '/hub/tasks';
    if (assignee) url += '?assignee=' + encodeURIComponent(assignee);
    const r = await fetch(url, { headers: AUTH });
    const data = await r.json();
    if (!data.success) return;
    renderTasks(data.tasks);
    populateAssigneeFilter(data.tasks);
  } catch(e) {}
}

function renderTasks(tasks) {
  const statuses = ['todo','in_progress','review','done','cancelled'];
  const cont = document.getElementById('taskColumns');
  cont.innerHTML = '';
  statuses.forEach(status => {
    const col = document.createElement('div');
    col.className = 'task-col col-' + status;
    const count = tasks.filter(t => t.status === status).length;
    col.innerHTML = `<h3>${STATUS_LABELS[status]} (${count})</h3>`;
    tasks.filter(t => t.status === status).forEach(task => {
      const card = document.createElement('div'); card.className = 'task-card';
      card.innerHTML = `<div class="title">${escHtml(task.title)}</div>
        ${task.assignee ? `<div class="assignee">👤 ${escHtml(task.assignee)}</div>` : ''}
        ${task.priority && task.priority !== 'medium' ? `<span class="priority priority-${task.priority}">${task.priority === 'high' ? '高' : '低'}</span>` : ''}`;
      card.onclick = () => showTaskDetail(task.id);
      col.appendChild(card);
    });
    cont.appendChild(col);
  });
}

function populateAssigneeFilter(tasks) {
  const sel = document.getElementById('filterAssignee');
  const current = sel.value;
  const assignees = [...new Set(tasks.map(t => t.assignee).filter(Boolean))];
  sel.innerHTML = '<option value="">全部负责人</option>';
  assignees.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    if (a === current) opt.selected = true;
    sel.appendChild(opt);
  });
}

function showNewTaskModal() { showModal('newTaskModal'); }
async function createTask() {
  const title = document.getElementById('newTaskTitle').value.trim();
  if (!title) return;
  const body = {
    title,
    desc: document.getElementById('newTaskDesc').value.trim(),
    assignee: document.getElementById('newTaskAssignee').value.trim() || undefined,
    priority: document.getElementById('newTaskPriority').value,
    created_by: AGENT_ID
  };
  Object.keys(body).forEach(k => body[k] === undefined && delete body[k]);
  try {
    await fetch(BASE + '/hub/task/create', {
      method: 'POST', headers: AUTH, body: JSON.stringify(body)
    });
    document.getElementById('newTaskTitle').value = '';
    document.getElementById('newTaskDesc').value = '';
    document.getElementById('newTaskAssignee').value = '';
    closeModal('newTaskModal');
    loadTasks();
  } catch(e) { alert('创建失败'); }
}

async function showTaskDetail(id) {
  try {
    const r = await fetch(BASE + '/hub/task?id=' + id, { headers: AUTH });
    const data = await r.json();
    if (!data.success) return;
    const t = data.task;
    document.getElementById('detailTitle').textContent = '#' + t.id + ' ' + t.title;
    let html = `<p style="color:var(--text2);font-size:13px;margin-bottom:8px">
      状态: ${STATUS_LABELS[t.status] || t.status}
      ${t.priority ? ' | 优先级: ' + (t.priority === 'high' ? '高' : t.priority === 'low' ? '低' : '中') : ''}
      ${t.assignee ? ' | 负责人: ' + escHtml(t.assignee) : ''}
    </p>`;
    if (t.desc) html += `<p style="margin-bottom:12px">${escHtml(t.desc)}</p>`;
    if (t.comments && t.comments.length) {
      html += '<div class="comments"><h4 style="font-size:14px;margin-bottom:8px">评论</h4>';
      t.comments.forEach(c => {
        html += `<div class="comment"><span class="author">${escHtml(c.author)}</span>
          <div class="text">${escHtml(c.content)}</div></div>`;
      });
      html += '</div>';
    }
    html += `<div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
      ${['todo','in_progress','review','done','cancelled'].filter(s => s !== t.status).map(s =>
        `<button class="btn-sm" style="background:var(--surface2);color:var(--text);border:1px solid var(--border)" onclick="updateTask(${t.id},'${s}')">→ ${STATUS_LABELS[s]}</button>`
      ).join('')}
    </div>
    <div style="margin-top:12px;display:flex;gap:6px">
      <input type="text" id="commentInput" placeholder="添加评论..." style="flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px">
      <button class="btn-sm" onclick="addComment(${t.id})">评论</button>
    </div>`;
    document.getElementById('detailBody').innerHTML = html;
    showModal('taskDetailModal');
  } catch(e) {}
}

async function updateTask(id, status) {
  try {
    await fetch(BASE + '/hub/task/update', {
      method: 'POST', headers: AUTH,
      body: JSON.stringify({ id, status, operator: AGENT_ID })
    });
    closeModal('taskDetailModal');
    loadTasks();
  } catch(e) {}
}

async function addComment(id) {
  const input = document.getElementById('commentInput');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  try {
    await fetch(BASE + '/hub/task/comment', {
      method: 'POST', headers: AUTH,
      body: JSON.stringify({ id, author: AGENT_ID, content })
    });
    showTaskDetail(id);
  } catch(e) {}
}

// ====== 状态墙 ======
async function loadStatuses() {
  try {
    const r = await fetch(BASE + '/hub/status', { headers: AUTH });
    const data = await r.json();
    if (!data.success) return;
    const cont = document.getElementById('statusGrid');
    cont.innerHTML = '';
    data.statuses.forEach(s => {
      const card = document.createElement('div'); card.className = 'status-card';
      card.innerHTML = `<div class="agent">🤖 ${escHtml(s.agent)}</div>
        <div class="status">${escHtml(s.status)}</div>
        ${s.message ? `<div class="message">${escHtml(s.message)}</div>` : ''}
        <div class="time">${timeAgo(s.timestamp)}</div>`;
      cont.appendChild(card);
    });
  } catch(e) {}
}

// ====== 轮询 ======
loadChannels();
loadMessages();
loadTasks();
loadStatuses();

setInterval(loadMessages, 3000);
setInterval(loadTasks, 5000);
setInterval(loadStatuses, 5000);

// 连接状态指示灯
setInterval(async () => {
  const dot = document.getElementById('statusDot');
  try {
    const r = await fetch(BASE + '/stats', { headers: AUTH });
    if (r.ok) { dot.style.color = '#34d399'; dot.title = '已连接'; }
  } catch(e) { dot.style.color = '#f87171'; dot.title = '连接断开'; }
}, 10000);
</script>
</body>
</html>
